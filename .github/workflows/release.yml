name: Publicar cliente

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar cliente
        shell: powershell
        run: ./src/client/build-client.ps1

      - name: Montar pacote
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $folder = "outputs/MarcaoBoost-$version-Cliente"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item outputs/MarcaoBoost.exe "$folder/MarcaoBoost.exe"
          Copy-Item src/native/LICENCA-AMD-USUARIO-FINAL.txt "$folder/LICENCA-AMD-USUARIO-FINAL.txt"
          Copy-Item src/native/NVIDIA-NVAPI-LICENSE.txt "$folder/NVIDIA-NVAPI-LICENSE.txt"
          Compress-Archive -Path "$folder/*" -DestinationPath "outputs/MarcaoBoost-$version-Cliente.zip" -Force

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: outputs/MarcaoBoost-*-Cliente.zip
